# Cyber Rats Co-op — runtime config
# Deployed next to the mod; read at startup. Lines starting with # or ; are comments.

[net]
# Transport backend: "enet" (LAN/dev) or "steam" (P2P friend invites, production).
transport = enet

# Player state send rate (Hz). 20 default, 30 for smoother remote motion at higher bandwidth.
player_send_hz = 20

# Enemy state send rate (Hz), host -> client.
enemy_send_hz = 18

# Render interpolation delay for remote entities (ms). Higher = smoother but laggier.
interp_delay_ms = 100

# Max extrapolation when starved of snapshots (ms) before freezing the remote entity.
max_extrapolate_ms = 250

[enet]
# Host bind / client connect. For two local instances use 127.0.0.1.
host_bind_port = 7777
connect_ip = 127.0.0.1
connect_port = 7777

[steam]
# App id for SteamAPI_Init in this non-Steamworks process.
app_id = 3565080
# Lobby visibility: friends_only | invisible | public
lobby_type = friends_only
# Dev override: paste a host SteamID64 to join directly without the overlay.
host_steamid = 0

[maze]
# Force a shared maze seed into GameInstance "Random Seed Roll" before generation so both peers
# build the same maze. -1 = don't force (use the game's natural seed). The host shares its seed
# over the network (M3b); this is the local override / fallback.
force_seed = -1

[role]
# "auto" negotiates host/client at handshake; force with "host" or "client" for testing.
role = auto

[debug]
# Verbose net logging to UE4SS.log.
log_net = 1
# Draw on-screen debug (puppet ghost markers, net stats) when supported.
draw_debug = 0
